<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="open-steamgate airship">
  <title>open-steamgate airship</title>
  <defs>
    <style>
      .c{fill:#F6F1E4}
      .d{fill:#17191D}
      .ln{fill:none;stroke:#17191D;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .sp{fill:none;stroke:#F6F1E4;stroke-width:12;stroke-linecap:round}
    </style>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="512" height="512" class="d"/>

  <!-- speed lines -->
  <path class="sp" d="M88 204H150M58 226H104M72 262H100M46 282H92M72 318H104"/>

  <!-- steam: puffs rising from the funnel, growing as they drift back -->
  <g class="c">
    <circle cx="318" cy="158" r="11"/>
    <circle cx="304" cy="136" r="16"/>
    <circle cx="280" cy="112" r="22"/>
    <circle cx="245" cy="94" r="28"/>
    <circle cx="206" cy="92" r="20"/>
    <circle cx="176" cy="102" r="10"/>
  </g>

  <!-- tail fins (small) -->
  <path class="c" d="M126 250 L130 226 Q140 224 152 238 L146 250 Z"/>
  <path class="c" d="M126 284 L130 308 Q140 310 152 296 L146 284 Z"/>

  <!-- funnel -->
  <rect x="298" y="170" width="40" height="11" rx="4" class="c"/>
  <rect x="302" y="179" width="12" height="20" class="c"/>
  <rect x="322" y="179" width="12" height="20" class="c"/>

  <!-- gondola struts and car -->
  <path d="M264 332V350M320 332V350" fill="none" stroke="#F6F1E4" stroke-width="5" stroke-linecap="round"/>
  <path class="c" d="M246 348H338L328 384Q326 390 320 390H264Q258 390 256 384Z"/>
  <g class="d">
    <rect x="268" y="358" width="12" height="22" rx="6"/>
    <rect x="286" y="358" width="12" height="22" rx="6"/>
    <rect x="304" y="358" width="12" height="22" rx="6"/>
  </g>

  <!-- hull: short tail cone, full body, big nose -->
  <path class="c" stroke="#17191D" stroke-width="8" stroke-linejoin="round" d="M111 267
    C124 256 140 248 156 242
    C176 222 210 206 250 200
    C300 194 360 194 390 198
    C430 204 452 232 452 267
    C452 302 430 330 390 336
    C360 340 300 340 250 334
    C210 328 176 312 156 292
    C140 286 124 278 111 267Z"/>
  <!-- tail cone seam -->
  <path class="ln" d="M156 242 C150 256 150 278 156 292"/>
  <path class="ln" d="M118 267 H150"/>
  <!-- ribs -->
  <path class="ln" d="M160 238 C200 222 262 214 340 212"/>
  <path class="ln" d="M160 267 H340"/>
  <path class="ln" d="M160 296 C200 312 262 320 340 322"/>
  <!-- the gate: a double ring band -->
  <path class="ln" d="M212 208 C194 236 194 298 212 326"/>
  <path class="ln" d="M246 201 C226 234 226 300 246 333"/>
  <!-- nose seam -->
  <path class="ln" d="M340 197 C318 230 318 304 340 337"/>
  <!-- rivets -->
  <g class="d">
    <circle cx="224" cy="232" r="5"/>
    <circle cx="221" cy="267" r="5"/>
    <circle cx="224" cy="302" r="5"/>
    <circle cx="352" cy="222" r="5"/>
    <circle cx="352" cy="312" r="5"/>
  </g>

  <!-- face: a dark visor band running out through the nose, goggles on it, a mouth below -->
  <rect x="334" y="243" width="160" height="44" rx="22" class="d"/>
  <rect x="328" y="255" width="16" height="20" rx="4" class="d"/>
  <g class="c">
    <circle cx="386" cy="265" r="17"/>
    <circle cx="428" cy="265" r="17"/>
    <rect x="400" y="261" width="14" height="8" rx="2"/>
  </g>
  <g class="d">
    <circle cx="386" cy="265" r="9"/>
    <circle cx="428" cy="265" r="9"/>
  </g>
  <rect x="394" y="302" width="26" height="10" rx="5" class="d"/>

  <!-- clouds below -->
  <g class="c">
    <path d="M86 392 Q86 376 104 376 Q110 356 132 360 Q146 344 164 356 Q180 354 184 372 Q200 374 200 392 Z"/>
    <path d="M364 378 Q364 366 378 366 Q384 350 400 354 Q414 350 418 366 Q430 368 430 378 Z"/>
  </g>
</svg>
