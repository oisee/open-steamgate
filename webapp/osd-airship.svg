<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>open-steamgate</title>
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.62" stop-color="#F6F0E2"/>
      <stop offset="1" stop-color="#E7DDC6"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C948"/>
      <stop offset="1" stop-color="#D9A21B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B8FF8A"/>
      <stop offset="0.55" stop-color="#3FD13F"/>
      <stop offset="1" stop-color="#1E8A2A"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#F3EEE2"/>

  <g stroke="#1B1B1F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- speed lines -->
    <path d="M18 96 H34 M14 166 H30" fill="none" stroke-width="5"/>

    <!-- steam -->
    <path d="M118 74 c-12 2 -20 -8 -14 -18 c-8 -10 2 -24 14 -20 c4 -12 22 -14 30 -4 c10 -6 24 2 22 14 c10 4 10 18 0 22 c-2 10 -16 12 -22 6 c-8 6 -22 6 -30 0 z" fill="#FFFFFF"/>
    <circle cx="92" cy="52" r="9" fill="#FFFFFF" stroke-width="5"/>
    <circle cx="74" cy="64" r="5" fill="#FFFFFF" stroke-width="4"/>

    <!-- chimney -->
    <rect x="140" y="80" width="18" height="20" rx="2" fill="url(#brass)"/>
    <rect x="135" y="74" width="28" height="9" rx="3" fill="url(#brass)"/>

    <!-- tail fins -->
    <path d="M74 112 L50 80 H78 L100 106 Z" fill="url(#brass)"/>
    <path d="M74 150 L50 182 H78 L100 156 Z" fill="url(#brass)"/>

    <!-- propeller -->
    <path d="M52 131 h14" fill="none"/>
    <ellipse cx="44" cy="116" rx="7" ry="14" fill="url(#brass)"/>
    <ellipse cx="44" cy="146" rx="7" ry="14" fill="url(#brass)"/>
    <circle cx="46" cy="131" r="6" fill="#1B1B1F"/>

    <!-- hull -->
    <ellipse cx="136" cy="131" rx="78" ry="36" fill="url(#hull)"/>
    <!-- hull seams -->
    <path d="M78 116 C110 106 162 106 196 114 M76 131 H206 M78 146 C110 156 162 156 196 148" fill="none" stroke-width="4"/>
    <!-- nose cap -->
    <path d="M204 112 c12 6 16 30 0 38 c6 -12 6 -26 0 -38 z" fill="url(#brass)"/>

    <!-- brass bands -->
    <path d="M112 97 C106 118 106 144 112 165 H132 C126 144 126 118 132 97 Z" fill="url(#brass)"/>
    <path d="M158 97 C152 118 152 144 158 165 H178 C172 144 172 118 178 97 Z" fill="url(#brass)"/>
  </g>

  <!-- rivets -->
  <g fill="#1B1B1F">
    <circle cx="121" cy="108" r="2.6"/><circle cx="118" cy="131" r="2.6"/><circle cx="121" cy="154" r="2.6"/>
    <circle cx="167" cy="108" r="2.6"/><circle cx="164" cy="131" r="2.6"/><circle cx="167" cy="154" r="2.6"/>
  </g>

  <g stroke="#1B1B1F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- struts -->
    <path d="M112 166 L120 184 M180 166 L172 184" fill="none" stroke-width="5"/>
    <!-- gondola -->
    <rect x="104" y="182" width="84" height="32" rx="7" fill="#2A2A30"/>
    <rect x="100" y="212" width="92" height="12" rx="5" fill="url(#brass)"/>
    <rect x="186" y="189" width="10" height="16" rx="3" fill="url(#brass)" stroke-width="5"/>
  </g>
  <!-- lights -->
  <g stroke="#D9A21B" stroke-width="3.5">
    <circle cx="124" cy="198" r="9" fill="#8E2B25"/>
    <circle cx="146" cy="198" r="9" fill="#8A6A1A"/>
    <circle cx="168" cy="198" r="9" fill="url(#glow)"/>
  </g>
  <circle cx="168" cy="198" r="15" fill="#5CFF5C" opacity="0.18"/>
  <g fill="#1B1B1F">
    <circle cx="112" cy="218" r="2.2"/><circle cx="146" cy="218" r="2.2"/><circle cx="180" cy="218" r="2.2"/>
  </g>
</svg>
