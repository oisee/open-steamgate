<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="osg.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>open-steamgate demo: launchpad</title>
  <style>
    html, body { height: 100%; margin: 0; }
  </style>
  <script>
    // The Fiori launchpad sandbox: two apps over the same transpiled service,
    // Travels (stg.travel) and Bookings (stg.booking), reachable by intent so
    // that cross-app navigation (UI.DataFieldForIntentBasedNavigation,
    // UI.DataFieldWithIntentBasedNavigation) has somewhere to go. Nothing
    // here is specific to open-steamgate: it is the sandbox any Fiori
    // developer runs locally.
    // The tiles: launchpad.js sets them again after the sandbox has mixed in
    // its own file (which replaces "groups" and adds every application of the
    // sandbox as a tile), so only these stay.
    window["stg-launchpad-groups"] = [
                {
                  id: "demo",
                  title: "open-steamgate",
                  isPreset: true,
                  isVisible: true,
                  isGroupLocked: false,
                  tiles: [
                    {
                      id: "travels",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Travels",
                        subtitle: "list report, object page",
                        info: "ZSTG_DEMO_SRV",
                        icon: "sap-icon://travel-itinerary",
                        targetURL: "#Travel-manage"
                      }
                    },
                    {
                      id: "bookings",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Bookings",
                        subtitle: "list report",
                        info: "ZSTG_DEMO_SRV",
                        icon: "sap-icon://flight",
                        targetURL: "#Booking-display"
                      }
                    },
                    {
                      id: "analytics",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Flight analytics",
                        subtitle: "analytical list page",
                        info: "ZSTG_SADL_SRV",
                        icon: "sap-icon://bar-chart",
                        targetURL: "#Flight-analyze"
                      }
                    },
                    {
                      id: "segw",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "SEGW",
                        subtitle: "Service Builder",
                        info: "ZSTG_SEGW_SRV",
                        icon: "sap-icon://tree",
                        targetURL: "#SegwProject-manage"
                      }
                    },
                    {
                      id: "status",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "System status",
                        subtitle: "what runs, on which ports",
                        info: "ZOSD_STATUS_SRV",
                        icon: "sap-icon://monitor",
                        targetURL: "#System-status"
                      }
                    },
                    {
                      id: "vividvibes",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Vivid Vibes",
                        subtitle: "a demo, in ABAP",
                        info: "ZCL_O4D_HTTP_HANDLER",
                        icon: "sap-icon://video",
                        targetURL: "#VividVibes-play"
                      }
                    },
                    {
                      id: "zork",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Zork",
                        subtitle: "a Z-machine, in ABAP",
                        info: "ZCL_APC_ZORK",
                        icon: "sap-icon://keyboard-and-mouse",
                        targetURL: "#Zork-play"
                      }
                    },
                    {
                      id: "lsd",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "SAP LSD",
                        subtitle: "a light-show, as SAP GUI screens",
                        info: "ZCL_LSD_APC_HANDLER",
                        icon: "sap-icon://sys-monitor",
                        targetURL: "#Lsd-play"
                      }
                    },
                    {
                      id: "webgui",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "WEBGUI",
                        subtitle: "Easy Success, the menu of this system",
                        info: "ZCL_OSD_WEBGUI",
                        icon: "sap-icon://tree",
                        targetURL: "#EasyAccess-show"
                      }
                    },
                    {
                      id: "source",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Source",
                        subtitle: "oisee/open-steamgate",
                        info: "GitHub",
                        icon: "sap-icon://source-code",
                        targetURL: "#Source-open"
                      }
                    },
                    {
                      // the same link as a picture, for a phone pointed at a
                      // screen: its own tile, because a static tile's icon
                      // box is too small for a code to be read from
                      id: "source-qr",
                      tileType: "sap.ushell.ui.tile.ImageTile",
                      properties: {
                        imageSource: "./qr-github.png",
                        targetURL: "#Source-open"
                      }
                    }
                  ]
                }
              ];
    window["sap-ushell-config"] = {
      defaultRenderer: "fiori2",
      renderers: {
        fiori2: {
          componentData: {
            config: {
              enableSearch: false,
              enablePersonalization: false,
              rootIntent: "Shell-home",
              // our own mark in the shell header, drawn here rather than
              // fetched: a drop over a pastel arc, the same two things the
              // Easy Success panel is made of
              appState: "lean",
              shellLogo: "osg.svg",
              rootIntentDisplayName: "open-steamgate"
            }
          }
        }
      },
      applications: {
        "Travel-manage": {
          title: "Travels",
          description: "open-steamgate demo",
          additionalInformation: "SAPUI5.Component=stg.travel",
          applicationType: "URL",
          url: "./",
          navigationMode: "embedded"
        },
        "Booking-display": {
          title: "Bookings",
          description: "open-steamgate demo",
          additionalInformation: "SAPUI5.Component=stg.booking",
          applicationType: "URL",
          url: "./booking/",
          navigationMode: "embedded"
        },
        "Flight-analyze": {
          title: "Flight analytics",
          description: "open-steamgate demo",
          additionalInformation: "SAPUI5.Component=stg.analytics",
          applicationType: "URL",
          url: "./analytics/",
          navigationMode: "embedded"
        },
        "SegwProject-manage": {
          title: "SEGW",
          description: "the Service Builder as an app",
          additionalInformation: "SAPUI5.Component=stg.segw",
          applicationType: "URL",
          url: "./segw/",
          navigationMode: "embedded"
        },
        "System-status": {
          title: "System status",
          description: "what runs, on which ports, out of which packs",
          additionalInformation: "SAPUI5.Component=stg.status",
          applicationType: "URL",
          url: "./status/",
          navigationMode: "embedded"
        },
        // Two that are not UI5 at all.
        //
        // The four above are components the launchpad loads. These two are
        // pages an ABAP class writes, served from the ICF path by the same
        // runtime — on Node behind the express shim, in the preview by the
        // service worker. No additionalInformation, so the sandbox treats
        // them as plain URLs and frames them, which is the honest shape: the
        // tile is a launchpad's way of pointing at a service, and what is
        // behind it does not have to be UI5 to belong on the page.
        "VividVibes-play": {
          title: "Vivid Vibes",
          description: "WebGL and audio, driven from ABAP over a push channel",
          applicationType: "URL",
          url: "../sap/bc/zo4d_demo",
          navigationMode: "embedded"
        },
        "Zork-play": {
          title: "Zork",
          description: "a Z-machine interpreter in ABAP, the story file out of SMW0",
          applicationType: "URL",
          url: "../sap/bc/zork",
          navigationMode: "embedded"
        },
        "EasyAccess-show": {
          title: "WEBGUI",
          description: "Easy Success: the classic entry screen, drawn by an ABAP class from the system's own status tables",
          applicationType: "URL",
          url: "../sap/bc/gui/sap/its/webgui/",
          navigationMode: "embedded"
        },
        "Lsd-play": {
          title: "SAP LSD",
          description: "the sap-lsd light-show, recorded as SAP GUI screens and replayed over a push channel",
          applicationType: "URL",
          url: "../sap/bc/lsd",
          navigationMode: "embedded"
        },
        "Source-open": {
          title: "Source",
          description: "the repository this launchpad is built from",
          applicationType: "URL",
          url: "https://github.com/oisee/open-steamgate",
          navigationMode: "newWindow"
        }
      },
      services: {
        LaunchPage: {
          adapter: {
            config: {
              groups: window["stg-launchpad-groups"]
            }
          }
        },
        NavTargetResolution: {
          config: {
            enableClientSideTargetResolution: true
          }
        }
      }
    };
  </script>
  <script src="https://ui5.sap.com/1.120.50/test-resources/sap/ushell/bootstrap/sandbox.js"
    id="sap-ushell-bootstrap"></script>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120.50/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m,sap.ushell,sap.ui.generic.app,sap.suite.ui.generic.template"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="allow"
    data-sap-ui-xx-componentPreload="off"
    data-sap-ui-flexibilityServices=""
    data-sap-ui-resourceroots='{"stg": "./", "stg.travel": "./", "stg.booking": "./booking", "stg.analytics": "./analytics", "stg.segw": "./segw", "stg.status": "./status"}'
    data-sap-ui-oninit="module:stg/launchpad"></script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
