services:
  osd:
    image: ghcr.io/oisee/open-steamgate:${OSD_TAG:-showcase-draft}
    init: true
    environment:
      # the container listens on every interface (the default is loopback,
      # which a published port never reaches); secure the published port
      OSD_BIND: "0.0.0.0"
      STG_DB: duckdb
      OSD_WORKERS: "1"
    ports:
      - "3030:3030"
    volumes:
      - osd-data:/data
    restart: unless-stopped
volumes:
  osd-data:
