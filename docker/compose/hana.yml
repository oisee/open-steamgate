# Connects to an existing HANA tenant. Supply connection values in the
# environment; this file starts no HANA server and stores no credentials.
# Existing core schemas need a fresh HANA_SCHEMA (for example OSD_SHOWCASE).
services:
  osd:
    image: ghcr.io/oisee/open-steamgate:${OSD_TAG:-showcase-draft}
    init: true
    environment:
      # the container listens on every interface (the default is loopback,
      # which a published port never reaches); secure the published port
      OSD_BIND: "0.0.0.0"
      STG_DB: hana
      HANA_HOST: ${HANA_HOST:?Set HANA_HOST in the environment}
      HANA_PORT: ${HANA_PORT:-39041}
      HANA_USER: ${HANA_USER:?Set HANA_USER in the environment}
      HANA_PASSWORD: ${HANA_PASSWORD:?Set HANA_PASSWORD in the environment}
      HANA_SCHEMA: ${HANA_SCHEMA:-OSD}
    ports:
      - "3030:3030"
    restart: unless-stopped
