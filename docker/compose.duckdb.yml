# Portainer: DuckDB demo, default instance 15 (8015/44315/3215/3315).
# Vivid Vibes, Zork and Vector workbench are included by default; set OSD_TAG=draft for core.
services:
  osd:
    image: ghcr.io/oisee/open-steamgate:${OSD_TAG:-showcase-draft}
    pull_policy: always
    init: true
    environment:
      # the container listens on every interface (the default is loopback,
      # which a published port never reaches); secure the published port
      OSD_BIND: "0.0.0.0"
      INSTANCE: "${INSTANCE:-15}"
      OSD_SID: OSD
      STG_ADT_SID: OSD
      STG_RFC_AUTH_MODE: "${STG_RFC_AUTH_MODE:-demo}"
      STG_DB: duckdb
      OSD_WORKERS: "1"
      TLS_SAN: "${TLS_SAN:-DNS:osd,DNS:localhost,IP:127.0.0.1}"
    ports:
      - "80${INSTANCE:-15}:3030"
      - "443${INSTANCE:-15}:44300"
      - "32${INSTANCE:-15}:32${INSTANCE:-15}"
      - "33${INSTANCE:-15}:33${INSTANCE:-15}"
    volumes:
      - osd-data:/data
      - osd-tls:/opt/osd/.local/tls
    restart: unless-stopped
    stop_grace_period: 60s
volumes:
  osd-data:
  osd-tls:
