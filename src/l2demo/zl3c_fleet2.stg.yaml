functions:
  StartRun:
    method: POST
    returns:
      entity: Answer
      multiplicity: '1'
    parameters:
      CheckDate: String(8)
      Mode: String(1)
      Work: String(4)
  ReleasePile:
    method: POST
    returns:
      entity: Answer
      multiplicity: '1'
    parameters:
      RunId: String(32)
      RuleName: String(60)
      PileNo: Int32
      PerPile: Int32
      Reason: String(80)
  ContinueGlass:
    method: POST
    returns:
      entity: Answer
      multiplicity: '1'
    parameters:
      RunId: String(32)
      NewGlass: Int32
      Reason: String(80)
  Resume:
    method: POST
    returns:
      entity: Answer
      multiplicity: '1'
    parameters:
      RunId: String(32)
  Doctor:
