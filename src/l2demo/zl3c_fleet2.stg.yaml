    returns:
      entity: Answer
      multiplicity: '1'
    parameters: {}
  SetKill:
    method: POST
    returns:
      entity: Answer
      multiplicity: '1'
    parameters:
      Reason: String(80)
  ClearKill:
    method: POST
    returns:
      entity: Answer
      multiplicity: '1'
    parameters:
      Reason: String(80)
  SetSetting:
    method: POST
    returns:
      entity: Answer
      multiplicity: '1'
    parameters:
      Param: String(30)
      Value: String(40)
      Note: String(80)
  ResetSetting:
    method: POST
    returns:
      entity: Answer
      multiplicity: '1'
    parameters:
      Param: String(30)
      Note: String(80)
  Schedule:
    method: POST
    returns:
      entity: Answer
      multiplicity: '1'
    parameters: {}
  Unschedule:
    method: POST
    returns:
      entity: Answer
      multiplicity: '1'
    parameters: {}
  ScheduleStatus:
    method: GET
    returns:
      entity: Answer
      multiplicity: '1'
    parameters: {}
