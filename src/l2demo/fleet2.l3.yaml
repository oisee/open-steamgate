# DSL L3, slice 3b: the fleet in two stages (docs/dsl-l3.md, "Stages, filters
# and a schedule"). A filter stage selects the ships with a voyage ahead into
# the worklist busy; the check stage piles over that worklist only and runs
# the deep rules there; a schedule runs the set every day at 02:00 system time.
# Slice 5a (docs/dsl-l3.md, "Resilience"): a failed or vanished pile is
# retried twice, a minute after it failed and doubled per attempt; the doctor
# takes over a silent pile or gate after 15 minutes; the daemon doctor is
# armed by every parallel run; a rule stops writing past 500 alerts in a run; a row of
# ZOSD_L3_KILL stops the set; final runs' plans go after 30 days.
# Slice 5d (docs/dsl-l3.md, "Simulated twin: the work as a port"): the work
# of a pile is the port work; iv_bind = 'work=sim' runs the same runner with a
# simulated twin of the checks (outcomes, durations and hits drawn from the
# seed), and close=sim closes its alerts by chance.
# Bounded concurrency (docs/dsl-l3.md, "Release by event"): the pile jobs are
# planned waiting on the event ZOSD_L3_RELEASE; a doctor's pass and each pile's
# tail release them up to the lanes in force, 3/4 of the background processes
# the set may use, at least one; the setting piles.lanes caps it (0 = no cap).
# `node tools/dsl-l3.mjs build src/l2demo/fleet2.l3.yaml --out src/l2demo`
set: fleet2
title: The fleet in two stages, busy ships first, then the deep checks
date: $date
params:
  active_status: {type: ZOSD_L2_SHIP-STATUS, default: A}
stages:
  - stage: candidates
    filter: true
    worklist: busy
    piles: {source: ships, size: 2}
    rules:
      - rule: ship_busy.l2.yaml
  - stage: checks
    input: ships_ref
    piles: {source: "worklist:busy", size: 2}
    rules:
      - rule: maintenance_ship.l2.yaml
      - rule: grounded_ship_crew.l2.yaml
      - rule: ship_captain.l2.yaml
      - rule: ship_voyage_limit.l2.yaml
      - rule: ship_min_crew.l2.yaml
      - rule: ship_cargo_limit.l2.yaml
snapshots:
  ships_ref: {source: ships, key: [ship_id], canonical: sorted-by-key}
piles: {release: event}
schedule: {every: 1d, at: "020000"}
ports:
  ships:
    kind: source
    table: ZOSD_L2_SHIP
    key: ship_id
    variants:
      table: generated
      capture: generated
  alerts:
    kind: sink
    table: ZOSD_L3_ALERT
    group: [set_name, rule_name, model_hash, check_date]
    seq: alert_seq
    variants:
      log: generated
      remote: {function: Z_L3_FLEET2_ALERTS, destination: remote.destination, group: ZL3_FLEET2_RFC}
      dummy: generated
      capture: generated
  close:
    kind: autoclose
    variants:
      none: generated
      capture: generated
      maintenance: zcl_l3_fleet2_autoclose
      sim: generated
  work:
    kind: work
    variants:
      real: generated
      sim: generated
bindings:
  ships: table
  alerts: log
  close: none
  work: real
resilience:
  doctor: {as: [daemon], tick: 10}
  retry: {max: 2, backoff: 60}
  stale: 900
  fuses:
    max_alerts: 500
    kill: ZOSD_L3_KILL
  dry_run: false
  keep: {days: 30}
governor:
  budget: {glass: 10, counts: open, warn: 0.7, narrow_at: 0.8, per_pile: 50}
  funnel: {group_by: object, autoclose: port:close}
simulate:
  seed: 42
  time_scale: 0.01
  allow_sink: [log]
  default:
    duration: {dist: lognormal, median: 40, p95: 300}
    outcome: {ok: 0.93, dump: 0.03, hang: 0.01, slow: 0.03}
    slow_factor: 5
    hits: {dist: poisson, mean: 2}
    autoclose: 0.4
  stages:
    candidates:
      duration: {dist: uniform, min: 5, max: 20}
      outcome: {ok: 0.5, dump: 0.5}
      keep: 0.5
  rules:
    ship-min-crew:
      hits: {dist: fixed, value: 1}
  # Chaos profiles (slice 6c): a named partial override of default:, chosen at run time by the
  # setting simulate.profile. A profile takes default's place in the precedence (rule > stage >
  # profile > default): the candidates stage and ship-min-crew keep what they name themselves.
  profiles:
    calm: {outcome: {ok: 0.99, dump: 0.005, hang: 0, slow: 0.005}}
    squall: {outcome: {ok: 0.85, dump: 0.08, hang: 0.02, slow: 0.05}}
    storm: {outcome: {ok: 0.6, dump: 0.2, hang: 0.1, slow: 0.1}, slow_factor: 10}
    flood: {hits: {dist: poisson, mean: 12}}
    stuck: {outcome: {ok: 0.7, hang: 0.3}}
    random: {outcome: {ok: 0.25, dump: 0.25, hang: 0.25, slow: 0.25}}
settings:
  tunable: [doctor.tick, budget.glass, budget.warn, budget.narrow_at, budget.per_pile, retry.max, retry.backoff, stale, fuses.max_alerts, keep.days, simulate.seed, simulate.time_scale, simulate.profile, simulate.dump, simulate.hang, simulate.slow, simulate.hits_mean, simulate.autoclose, piles.checks.size, piles.lanes, remote.destination]
  bounds:
    fuses.max_alerts: {min: 1, max: 100000}
cockpit: {app: zosd_fleet2, service: ZL3C_FLEET2_SRV, title: Fleet run cockpit}
