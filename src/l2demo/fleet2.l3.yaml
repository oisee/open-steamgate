# DSL L3, slice 3b: the fleet in two stages (docs/dsl-l3.md, "Stages, filters
# and a schedule"). A filter stage selects the ships with a voyage ahead into
# the worklist busy; the check stage piles over that worklist only and runs
# the deep rules there; a schedule runs the set every day at 02:00 system time.
# Slice 5a (docs/dsl-l3.md, "Resilience"): a failed or vanished pile is
# retried twice, a minute after it failed and doubled per attempt; the doctor
# takes over a lock, a pile or a gate left for 15 minutes and runs as a job of
# the schedule; a rule stops writing past 500 alerts in a run; a row of
# ZOSD_L3_KILL stops the set; final runs' plans go after 30 days.
# Slice 5d (docs/dsl-l3.md, "Simulated twin: the work as a port"): the work
# of a pile is the port work; iv_bind = 'work=sim' runs the same runner with a
# simulated twin of the checks (outcomes, durations and hits drawn from the
# seed), and close=sim closes its alerts by chance.
# `node tools/dsl-l3.mjs build src/l2demo/fleet2.l3.yaml --out src/l2demo`
set: fleet2
title: The fleet in two stages, busy ships first, then the deep checks
date: $date
params:
  active_status: {type: ZOSD_L2_SHIP-STATUS, default: A}
stages:
  - stage: candidates
    filter: true
    worklist: busy
    piles: {source: ships, size: 2}
    rules:
      - rule: ship_busy.l2.yaml
  - stage: checks
    piles: {source: "worklist:busy", size: 2}
    rules:
      - rule: maintenance_ship.l2.yaml
      - rule: grounded_ship_crew.l2.yaml
      - rule: ship_captain.l2.yaml
      - rule: ship_voyage_limit.l2.yaml
      - rule: ship_min_crew.l2.yaml
      - rule: ship_cargo_limit.l2.yaml
schedule: {every: 1d, at: "020000"}
ports:
  ships:
    kind: source
    table: ZOSD_L2_SHIP
    key: ship_id
    variants:
      table: generated
      capture: generated
  alerts:
    kind: sink
    table: ZOSD_L3_ALERT
    group: [set_name, rule_name, model_hash, check_date]
    seq: alert_seq
    variants:
      log: generated
      dummy: generated
      capture: generated
  close:
    kind: autoclose
    variants:
      none: generated
      capture: generated
      maintenance: zcl_l3_fleet2_autoclose
      sim: generated
  work:
    kind: work
    variants:
      real: generated
      sim: generated
bindings:
  ships: table
  alerts: log
  close: none
  work: real
resilience:
  retry: {max: 2, backoff: 60}
  stale: 900
  fuses:
    max_alerts: 500
    kill: ZOSD_L3_KILL
  dry_run: false
  keep: {days: 30}
governor:
  budget: {glass: 10, counts: open, warn: 0.7, narrow_at: 0.8, per_pile: 50}
  funnel: {group_by: object, autoclose: port:close}
simulate:
  seed: 42
  time_scale: 0.01
  allow_sink: [log]
  default:
    duration: {dist: lognormal, median: 40, p95: 300}
    outcome: {ok: 0.93, dump: 0.03, hang: 0.01, slow: 0.03}
    slow_factor: 5
    hits: {dist: poisson, mean: 2}
    autoclose: 0.4
  stages:
    candidates:
      duration: {dist: uniform, min: 5, max: 20}
      outcome: {ok: 0.5, dump: 0.5}
      keep: 0.5
  rules:
    ship-min-crew:
      hits: {dist: fixed, value: 1}
settings:
  tunable: [budget.glass, budget.warn, budget.narrow_at, budget.per_pile, retry.max, retry.backoff, stale, fuses.max_alerts, keep.days, simulate.seed, simulate.time_scale, piles.checks.size]
  bounds:
    fuses.max_alerts: {min: 1, max: 100000}
cockpit: {app: zosd_fleet2, service: ZL3C_FLEET2_SRV, title: Fleet run cockpit}
