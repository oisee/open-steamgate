# DSL L3, slice 1: the fleet's rules run as one set, every alert logged in
# ZOSD_L3_ALERT under its rule's model hash (docs/dsl-l3.md).
# `node tools/dsl-l3.mjs build src/l2demo/fleet.l3.yaml --out src/l2demo`
# writes the runner ZCL_L3_FLEET, the job report ZL3_FLEET, the ports'
# interfaces, variants and factory, and their traces.
set: fleet
title: Every fleet rule, checked for one date
date: $date
rules:
  - rule: maintenance_ship.l2.yaml
  - rule: grounded_ship_crew.l2.yaml
  - rule: ship_captain.l2.yaml
  - rule: ship_voyage_limit.l2.yaml
  - rule: ship_min_crew.l2.yaml
  - rule: ship_cargo_limit.l2.yaml
  - rule: ship_max_cargo.l2.yaml
    enabled: false
# Ports and adapters: what the runner reads and what it writes through, each a
# typed interface with variants; `bindings` is the default variant of each,
# and a run may name others (run( iv_bind = 'ships=capture,alerts=dummy' )).
ports:
  ships:
    kind: source
    table: ZOSD_L2_SHIP
    key: ship_id
    variants:
      table: generated
      capture: generated
  alerts:
    kind: sink
    table: ZOSD_L3_ALERT
    group: [set_name, rule_name, model_hash, check_date]
    seq: alert_seq
    variants:
      log: generated
      dummy: generated
      capture: generated
bindings:
  ships: table
  alerts: log
