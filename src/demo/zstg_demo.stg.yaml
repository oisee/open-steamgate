# The demo service as one file. `npm run stg:compile -- src/demo/zstg_demo.stg.yaml --out <dir>`
# writes the SEGW project tree (IWPR), the registration objects (IWSV, IWMO)
# and the _MPC/_DPC classes SEGW would generate from that tree; the
# hand-written classes in this folder are what a developer writes on top
# (their _EXT). test/stg-compile.mjs keeps this file and the hand-written
# model in step.
project: ZSTG_DEMO
service: ZSTG_DEMO_SRV
model: ZSTG_DEMO_MDL
description: "open-steamgate demo: travels and bookings"

entities:
  Travel:
    set: TravelSet
    keys: [TravelId]
    searchable: true
    properties:
      TravelId: {type: String(8), field: TRAVEL_ID, label: Travel}
      Description: {type: String(40), label: Description}
      Status: {type: String(1), label: Status}
      Seats: {type: Int32, label: Seats}
      # read-only, the DPC fills it from the value-help table
      StatusText: {type: String(40), field: STATUS_TEXT, readonly: true, sortable: false, filterable: false, label: Status text}
      # where the picture of this travel is read: the media resource of the
      # Photo entity, filled by the DPC, shown by UI.IsImageURL
      PhotoUrl: {type: String(120), field: PHOTO_URL, readonly: true, sortable: false, filterable: false, label: Photo}

  Booking:
    set: BookingSet
    keys: [TravelId, BookingId]
    properties:
      TravelId: {type: String(8), field: TRAVEL_ID, label: Travel}
      BookingId: {type: String(4), field: BOOKING_ID, label: Booking}
      Customer: {type: String(40), label: Customer}
      FlightDate: {type: DateTime, digits: 0, field: FLIGHT_DATE, label: Flight date}

  # a media entity: its content is a stream, read and written at
  # PhotoSet('T0001')/$value through the DPC's GET_STREAM / UPDATE_STREAM
  Photo:
    set: PhotoSet
    media: true
    keys: [TravelId]
    creatable: false
    deletable: false
    pageable: false
    operations: [R, Q]
    properties:
      TravelId: {type: String(8), field: TRAVEL_ID, readonly: true, label: Travel}
      MimeType: {type: String(40), field: MIME_TYPE, readonly: true, sortable: false, filterable: false, label: MIME type}
      FileName: {type: String(40), field: FILE_NAME, readonly: true, sortable: false, filterable: false, label: File name}

  StatusVH:
    set: StatusVHSet
    keys: [Status]
    creatable: false
    updatable: false
    deletable: false
    searchable: true
    operations: [R, Q]
    properties:
      Status: {type: String(1), readonly: true, label: Status}
      Text: {type: String(40), readonly: true, label: Status text}

associations:
  TravelToBookings:
    from: Travel
    to: Booking
    cardinality: 1:N
    constraint: {TravelId: TravelId}
    navigation: {Travel: to_Bookings, Booking: to_Travel}

functions:
  CancelTravel:
    method: POST
    returns: {entity: Travel, set: TravelSet, multiplicity: "1"}
    for: Travel
    parameters:
      TravelId: {type: String(8), field: TRAVEL_ID}
  TravelCount:
    method: GET
    # A scalar count, which is what the dispatcher answers:
    # {"d":{"TravelCount":3}}. Classic SEGW has no return kind for a
    # primitive, so `stg-compile` warns that a system will refuse to generate
    # runtime objects for this one until it is given an entity or a complex
    # type by hand -- measured on A4H 2026-09-19. The model says what we
    # serve; the warning says what SEGW will do about it.
    returns: {primitive: Edm.Int32}
    parameters:
      Status: {type: String(1)}

# The Fiori annotations of the demo, in the model instead of a local
# annotation file: stg-compile writes them into ZCL_ZSTG_DEMO_MPC_ANN, the
# hand-written _MPC_EXT calls it, $metadata carries them. (The Bookings app
# keeps its own local file for its list report; the demo's Travels app has none.)
annotations:
  Travel:
    header: {typeName: Travel, typeNamePlural: Travels, title: Description, imageUrl: PhotoUrl}
    selectionFields: [Status, TravelId, Description]
    lineItem:
      - {value: PhotoUrl, label: Photo}
      - {value: TravelId, label: Travel}
      - {value: Description, label: Description}
      - {value: Status, label: Status}
      - {value: Seats, label: Seats}
    facets:
      - {id: General, label: General, fieldGroup: General}
      - {id: Bookings, label: Bookings, lineItem: to_Bookings}
    fieldGroups:
      General: [TravelId, Description, Status, Seats]
  Travel/TravelId:
    label: Travel
    valueList:
      label: Travels
      collection: TravelSet
      search: false
      parameters: [{inOut: {TravelId: TravelId}}, {displayOnly: Description}, {displayOnly: StatusText}]
  Travel/Description: {label: Description}
  Travel/Status:
    label: Status
    text: {path: StatusText, arrangement: TextFirst}
    valueList:
      label: Status
      collection: StatusVHSet
      search: true
      parameters: [{inOut: {Status: Status}}, {displayOnly: Text}]
  Travel/StatusText: {label: Status text}
  # the value is a URL to an image, not text: Fiori Elements renders it as one
  Travel/PhotoUrl: {label: Photo, isImageUrl: true}
  Travel/Seats: {label: Seats}
  Booking:
    header: {typeName: Booking, typeNamePlural: Bookings, title: Customer, description: BookingId}
    facets:
      - {id: BookingGeneral, label: General, fieldGroup: General}
    fieldGroups:
      General: [BookingId, Customer, FlightDate]
    lineItem:
      - {intent: {label: Open in Bookings, semanticObject: Booking, action: display}}
      - {value: BookingId, label: Booking}
      - {value: Customer, label: Customer}
      - {value: FlightDate, label: Flight date}
  Booking/BookingId: {label: Booking}
  Booking/Customer: {label: Customer}
  Booking/FlightDate: {label: Flight date}
  StatusVH/Status: {label: Status}
  StatusVH/Text: {label: Status text}
