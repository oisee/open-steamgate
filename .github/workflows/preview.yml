name: preview deployment

# Every pull request and every push to main gets a copy of open-steamgate that
# runs entirely in the browser (build/preview/: the gateway in a service worker, the
# Fiori demo app), published on GitHub Pages from the gh-pages branch:
#   main         -> https://oisee.github.io/open-steamgate/main/
#   PR <n>       -> https://oisee.github.io/open-steamgate/pr-<n>/
# The pattern is larshp/hithub's preview-deploy workflow (MIT).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.action != 'closed'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PREVIEW_DIRECTORY: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}"
      # The commit of the transpiler this deployment is pinned to, or empty
      # to use whatever npm resolves. See the step below.
      OSD_CORE_REF: "52ba51a5662b93bd5093a9c1adef64bd438ce7f0"
      # The GUI substitutes, at the fork branch that raises sapevent on the
      # HTML viewer (docs/webgui.md, backlog G.2). Without a folder the build
      # clones the fork's default branch, which tracks upstream and does not
      # have it, so the branch commit is pinned the same way as the core.
      OSD_GUI_REF: "0324e1c1538f7ac63826ebbddab3fbee31c4501c"
      OSD_TRANSPILER_REF: "0263e42892063be5008eab42a5f836bc19385b82"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The public build needs a transpiler that is not on npm yet.
      #
      # Two of the fixes the media path rests on are still open pull
      # requests: #1845, a binary file surviving the copy to output, and
      # #1846, a W3MI object keyed on its name rather than its file name.
      # On a published transpiler a runner writes no *.w3mi.data.* files at
      # all, so the bundle it builds is not the bundle this repository
      # tests, and the first thing that notices is an ENOENT on a PNG.
      # The third is the runtime's: a float compared with a character
      # literal (abaplint/transpiler#1859), which is what made the demo
      # label its bars on the second frame; APPEND of a raw number keeping
      # its fraction (a sine table was zeros); MOD with a float operand;
      # a negative half rounding away from zero; and core 2.120.54, whose
      # #4293 stops an inline DATA from an expression with a character
      # literal being a character. The pinned commit carries all of them
      # on top of the published 2.13.87.
      #
      # So the deployment is pinned to a commit of an integration branch,
      # built here and linked the same way a developer links it. Pinned to a
      # SHA rather than a branch on purpose: a moving branch would make the
      # public site depend on what somebody pushed this morning. Setting
      # OSD_TRANSPILER_REF to an empty string turns the whole thing off and
      # takes what npm gives. DEBT-2026-09-14-ci-pinned-transpiler: this
      # comes out the day both pull requests are released.
      - name: Build the transpiler this deployment is pinned to
        if: env.OSD_TRANSPILER_REF != ''
        run: |
          git clone --filter=blob:none https://github.com/oisee/transpiler.git ../transpiler
          git -C ../transpiler checkout "$OSD_TRANSPILER_REF"
          # the root first: @types/node lives there, and tsc in each package
          # resolves it by walking up. --ignore-scripts because the root's
          # own "install" script calls npm install again.
          npm --prefix ../transpiler install --ignore-scripts --no-audit --no-fund
          for package in runtime transpiler extras cli; do
            npm --prefix "../transpiler/packages/$package" install --no-audit --no-fund
          done
          for package in runtime transpiler extras cli; do
            npm --prefix "../transpiler/packages/$package" run compile
          done
          # the bin is recorded in git as 100644. It is executable on a
          # developer's machine because npm sets that bit when it installs a
          # package, and a clone never went through npm. Locally nothing
          # notices; on a runner it is "abap_transpile: Permission denied".
          chmod +x ../transpiler/packages/cli/abap_transpile
          # three packages, not two: the transpile is a library call into
          # @abaplint/transpiler (tools/osd-transpile.mjs), and with only the
          # CLI linked the published transpiler did the work - every W3MI
          # object was then keyed on its escaped file name and every picture
          # and the Zork story were 404 in the browser check
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs transpiler-cli packages/cli
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-transpiler.mjs
      # The library patches this tree holds until they land upstream. The
      # media path runs on SCMS_BINARY_TO_XSTRING, which open-abap-core does
      # not have, and on a WWWDATA_IMPORT that consumes its remainder; a
      # runner that clones upstream gets a handler that raises on every
      # picture and on the Zork story (500 in the browser check, measured
      # 2026-09-17 after the objid fix turned the 404 into a 500). So the
      # library is taken from the same integration branch the workstation
      # runs, at a commit, into the folder abap_transpile.json names first.
      # DEBT-2026-09-14-ci-pinned-transpiler covers this pin as well: it
      # goes when the pull requests to open-abap-core are released.
      - name: The library patches this deployment is pinned to
        run: |
          git clone --filter=blob:none https://github.com/oisee/open-abap-core.git .local/lars/open-abap-core
          git -C .local/lars/open-abap-core checkout -q "$OSD_CORE_REF"
          git clone --filter=blob:none https://github.com/oisee/open-abap-gui.git .local/lars/open-abap-gui
          git -C .local/lars/open-abap-gui checkout -q "$OSD_GUI_REF"
      # The packs: the demo and Zork are not in this repository, they are
      # fetched from theirs at the commit each pack's manifest pins
      # (tools/osd-fetch.mjs), and the pack's own folder layers over that.
      # The build refuses a pack that was not fetched, so this step is not
      # optional: without it the preview would be published smaller than
      # the manifests say and look complete.
      - name: Fetch the pack sources
        run: node tools/osd-fetch.mjs
      - run: npm run web:preview
      - run: npx playwright install --with-deps chromium
      - name: Check the build in a browser
        run: npx playwright test --config playwright.preview.config.mjs
      - name: Screenshots
        run: node scripts/capture-screenshots.mjs
      - name: Publish to gh-pages
        # This is deliberately after the browser check and screenshots.  The
        # explicit success guard documents the safety property: a failed
        # build, test, or screenshot step never replaces the last published
        # preview.
        if: ${{ success() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/preview
          destination_dir: ${{ env.PREVIEW_DIRECTORY }}
          keep_files: true
          commit_message: "Deploy ${{ env.PREVIEW_DIRECTORY }} from ${{ github.sha }}"
      - name: Refresh the index of all published previews
        if: ${{ success() }}
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/gh-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # actions/checkout fetches only the triggering branch. Without an
          # explicit destination this updates FETCH_HEAD, not origin/gh-pages.
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach "$pages" origin/gh-pages
          node scripts/pages-index.mjs "$pages"
          git -C "$pages" add index.html
          if ! git -C "$pages" diff --cached --quiet -- index.html; then
            git -C "$pages" config user.name "github-actions[bot]"
            git -C "$pages" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$pages" commit -q -m "Refresh preview index"
            git -C "$pages" push origin HEAD:gh-pages
          fi
          git worktree remove "$pages"
      - name: Preview comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- open-steamgate-preview -->'
          base="https://oisee.github.io/open-steamgate/pr-$PR_NUMBER"
          body=$(printf '%s\n\nPreview: [open the launchpad](%s/app/flp.html) - the OData gateway, the demo and Zork run in your browser, no server.\n\n[Screenshots](%s/screenshots/) - built from `%s`' \
            "$marker" "$base" "$base" "${GITHUB_SHA:0:7}")
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))][0].id // empty")
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

  remove:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Remove the preview directory
        run: |
          set -euo pipefail
          dir="pr-${{ github.event.pull_request.number }}"
          if [[ -d "pages/$dir" ]]; then
            git -C pages rm -r -q "$dir"
            node source/scripts/pages-index.mjs pages
            git -C pages config user.name "github-actions[bot]"
            git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C pages add index.html
            git -C pages commit -q -m "Remove $dir"
            git -C pages push origin HEAD:gh-pages
          fi
