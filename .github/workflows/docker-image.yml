name: OSD Docker draft
on:
  pull_request:
    paths: ['docker/**', 'src/**', 'tools/**', 'test/**', 'package*.json', 'abap_transpile.json', '.github/workflows/docker-image.yml']
  push:
    branches: [feat/docker-image]
    tags: ['osd-image-*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested images to GHCR
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation and Compose
        env:
          ACCEPT_SAP_LICENSE: 'YES' # compose config only; CI does not start HXE
        run: |
          node scripts/sync-spin.mjs --check
          node --test docker/image/free-instance.test.mjs docker/image/terminal-svg.test.mjs
          for db in sqlite duckdb hana postgres; do
            docker compose -f "docker/compose.$db.yml" config --quiet
          done
      - name: Build the single OSD image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64 --load --tag osd:ci --build-arg OSD_IMAGE_REVISION="$GITHUB_SHA" -f docker/image/Dockerfile .
      - name: Check runtime license inventory
        run: |
          docker run --rm --entrypoint node osd:ci -e 'const r=require("./image-licenses.json"); console.log(JSON.stringify(r,null,2)); if(r.blockers.length) process.exit(1)'
          docker run --rm --entrypoint sh osd:ci -c 'test ! -e /opt/protocols && ! command -v go'
      - name: Build external SAP-TUI and RFC acceptance clients (test only)
        run: docker buildx build --platform linux/amd64 --load --tag osd-probes:ci -f docker/image/Dockerfile.probes .
      - name: Compose startup, persistence, HTTP/HTTPS, SAP-TUI and ADT-over-RFC
        env:
          OSD_ACCEPTANCE_DIR: ${{ github.workspace }}/image-acceptance
        run: sh docker/image/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-acceptance
          retention-days: 14
          if-no-files-found: error
          path: image-acceptance/
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: osd:ci
          output-file: osd.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Save the exact tested images
        run: |
          docker save -o images.tar osd:ci
          docker image inspect --format '{{.Id}}' osd:ci > image-ids.txt
          node -e 'require("fs").writeFileSync("provenance.json",JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: tested-docker-images
          retention-days: 3
          compression-level: 0
          path: |
            images.tar
            image-ids.txt
            *.spdx.json
            provenance.json
  publish:
    needs: image
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/feat/docker-image' || startsWith(github.ref, 'refs/tags/osd-image-')))
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-docker-images
      - name: Load the tested images without rebuilding
        run: |
          docker load -i images.tar
          docker image inspect --format '{{.Id}}' osd:ci > loaded-ids.txt
          diff -u image-ids.txt loaded-ids.txt
      - name: Publish the tested draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag osd:ci "$registry:$tag"
          docker push "$registry:$tag"
          docker tag osd:ci "$registry:docker-draft"
          docker push "$registry:docker-draft"
          printf 'OSD_TAG=%s\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
