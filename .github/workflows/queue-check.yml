# What the notes claim about an upstream item, against what the tracker says.
#
# The tool exists because a list of tasks is the one instrument in this tree
# with no test of its own: it is read like a measurement and ages like an
# opinion. Both sessions found the queue stale twice in a single day.
#
# But a tool nobody calls is a tool that does not exist — the defect this
# repository spent that same day removing from its own code, seven times over.
# `npm run queue` was a hand command for exactly as long as it took to notice
# that, which is what this file is.
#
# It asks GitHub, so it cannot live in `npm test`: that suite has to run on a
# machine with no network and no token, and a check that quietly degrades to
# "could not ask" inside a green suite is worse than no check. Here it has a
# token, and here it is allowed to fail loudly.
name: queue check

on:
  push:
  pull_request:
  # The notes go stale on their own, without a commit: a pull request merged
  # upstream at midnight makes a line untrue while this repository sleeps. So
  # it is also asked on a schedule rather than only when somebody edits.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

# A newer push to a pull request supersedes its run; pushes elsewhere are
# never cancelled (the same rule as tests.yml, #602).
concurrency:
  group: queue-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Exit 1 is a contradiction and exit 3 means no references were found:
      # both fail. Exit 2 means the tracker could not be asked; retry it.
      # This workflow is not a required branch check.
      - name: ask the tracker
        id: tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            code=0
            node tools/osd-queue-check.mjs || code=$?
            if [ "$code" -eq 0 ]; then
              echo 'outcome=checked' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$code" -ne 2 ]; then
              if [ "$code" -eq 3 ]; then
                echo 'outcome=no-references' >> "$GITHUB_OUTPUT"
              else
                echo 'outcome=contradiction' >> "$GITHUB_OUTPUT"
              fi
              exit "$code"
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo 'outcome=unavailable' >> "$GITHUB_OUTPUT"
          echo '::warning::Tracker unavailable after three attempts; queue notes were not checked'
          echo 'Queue check outcome: **unavailable** after three attempts. The notes were not checked.' >> "$GITHUB_STEP_SUMMARY"
