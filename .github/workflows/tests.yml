name: tests

# The suites, read by something other than a person.
#
# Written 2026-09-19 after an independent review pointed at a hole nobody
# had looked in: this repository had **1020 wire tests, 159 ABAP unit
# methods and a clean lint, and no workflow that read any of them**.
# `leak-scan.yml` reads what is about to be published and `preview.yml`
# builds the browser deployment and checks it; neither runs a test.
#
# What that cost, measured rather than imagined: `test/segw-tree.mjs` was
# **3 failing on the published branch** before that evening and **8 after**
# it, across a push cycle, and nothing said so. The invariant it holds is
# not a small one — the ABAP generator and the Node generator write the
# same bytes — and it is the guarantee the whole SEGW-in-ABAP track rests
# on.
#
# This tree's own rule is "an instrument that cannot go red is
# indistinguishable from a broken one". It had been applied to every
# instrument except the suite.
#
# Both workflows load their source refs from libs.lock.json through
# tools/osd-lock.mjs, so neither job carries a second copy of the pins.

on:
  pull_request:
  push:
    branches: [main]
    tags: [vscode-v*]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

# **`pipefail`, and it is not paranoia.** A `run:` step without a `shell:`
# key runs under `bash -e {0}` — `-e`, and **no** `pipefail`. So a step that
# pipes anything reports the status of the last stage of the pipe, and a
# failing suite piped into `tee` or `tail` is a green step. That is not
# hypothetical: the author of this file did exactly that from a terminal an
# hour before writing it (`node tools/osd-suites.mjs | tail -6` → exit 0,
# tail's), and fable-osd pointed out that the same trap fits in here.
#
# `shell: bash` is GitHub's own alias for `bash --noprofile --norc -eo
# pipefail {0}`. Setting it once for the job closes the class instead of
# checking each step for pipes, which is the difference between a rule and a
# habit.
defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"

      # **The binary builds from a checkout, before anything is generated.**
      # `npm run binary` bundles bin/osd.mjs and everything it reaches, and
      # twice it reached a file only another build writes: gen/ (a static
      # import of gen/osd-ddic-binary.mjs in test/setup.mjs) and
      # web/generated/amdp.mjs (written by the preview build). On a
      # workstation both are left over and the build is green; here, before
      # the transpile step, they do not exist, which is the state a fresh
      # clone is in. Built outside build/ so the suites' runtime cases of
      # test/osd-binary.mjs stay as they were; `doctor` checks what the
      # bundle did to the runtime's class names.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build the binary from the clean checkout
        run: |
          bun scripts/build-binary.mjs "$RUNNER_TEMP/osd"
          "$RUNNER_TEMP/osd" doctor

      # libs.lock.json includes the pinned repository and commit. Hashing the
      # build script invalidates compiled output when its commands change.
      # Outside the checkout, and absolute: actions/cache silently refuses to
      # save a path with ".." in it ("Relative pathing '.' and '..' is not
      # allowed"), which is how the first version of this cache never hit.
      - name: Where the pinned transpiler lives
        run: echo "TRANSPILER=$RUNNER_TEMP/transpiler" >> "$GITHUB_ENV"
      - name: Restore the pinned transpiler build
        id: transpiler_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/transpiler
          key: transpiler-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('libs.lock.json') }}-${{ hashFiles('tools/osd-ci-transpiler-build.sh') }}
      - name: Build the transpiler this tree is pinned to
        if: steps.transpiler_cache.outputs.cache-hit != 'true'
        run: bash tools/osd-ci-transpiler-build.sh build
      - name: Verify and link the pinned transpiler
        run: |
          bash tools/osd-ci-transpiler-build.sh verify
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs transpiler-cli packages/cli
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-transpiler.mjs

      # The build refuses a pack that was not fetched, so this is not
      # optional: without it the suites would run against a smaller system
      # than the manifests describe and look complete.
      - name: Fetch the pack sources
        run: node tools/osd-fetch.mjs

      # **The library folders, from the config rather than from a list here.**
      # The transpiler falls back to a lib's url and clones into a temporary
      # directory, so a BUILD on a clean machine works. The object store does
      # not: it reads `lib.folder` off the disk, and a folder that is not
      # there is a library its registry does not have. Four of the six were
      # missing on this runner, and it came back as twelve failures that
      # looked like twelve different things -- "RAISE, unknown class
      # /iwbep/cx_mgw_busi_exception", a check run that never reached
      # `processed`, an activation that never reported activationExecuted.
      #
      # It checks the full list and exact refs from libs.lock.json and leaves
      # matching clones untouched.
      - name: The library folders the object store reads
        run: |
          node tools/osd-libs.mjs
          node tools/osd-libs.mjs --check

      # **Transpile first, and the order is load-bearing.** `npm run lint`
      # analyses `src/` **and `gen/`**, and `gen/` is written by the
      # transpile step: the SEGW registry, the search-help registry, the RFC
      # dispatcher, the transaction registry, the BSP registry. On a
      # workstation that directory is left over from the last run, so lint is
      # green there; on a clean runner it does not exist and lint reports 46
      # errors of the form "Class zcl_stg_bsp_registry not found".
      #
      # This workflow was written on 2026-09-19 to close the hole that
      # nothing read the suites, and it then failed on this step **six runs
      # in a row** without anybody looking at why -- including the run of the
      # commit that announced it. A check that has never been green is not
      # yet an instrument, and "CI reads the tests now" was a claim about a
      # file rather than about a result.
      - name: Transpile
        run: npm run transpile

      - run: npm run lint

      - name: ABAP Unit
        run: node tools/osd-unit-run.mjs

      - name: BAL survives an OSD process restart
        run: npm run test:bal-persist

      # Artifact belongs to this run, not to a generation-hash cache. Tar
      # preserves the live/output links and executable modes that Actions
      # artifacts would discard. The clone is relocated inside the checkout
      # so npm ci in consumers supplies its package dependencies.
      - name: Pack the built tree
        run: |
          mkdir -p .local/ci-artifact
          tar -C "$RUNNER_TEMP" --exclude='node_modules' -cf - transpiler | tar -C .local/ci-artifact -xf -
          node tools/osd-ci-artifact.mjs pack "$RUNNER_TEMP/built-tree.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: built-tree
          path: ${{ runner.temp }}/built-tree.tar
          if-no-files-found: error
          retention-days: 1

  suites:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: built-tree
          path: ${{ runner.temp }}
      - name: Restore and verify this run's build
        run: |
          tar -xf "$RUNNER_TEMP/built-tree.tar"
          test -f gen/osd-ddic-binary.mjs
          test -f output/init.mjs
          test -f build/live/manifest.json
          test -d .local/lars/open-abap-core
          test -f .local/ci-artifact/transpiler/packages/transpiler/build/src/index.js
          echo "TRANSPILER=$PWD/.local/ci-artifact/transpiler" >> "$GITHUB_ENV"
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler packages/transpiler
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler-cli packages/cli
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs runtime packages/runtime
      - name: Select VSIX test profile
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF" == refs/tags/* ]]; then
            echo OSD_CI_FULL_VSIX=1 >> "$GITHUB_ENV"
            echo 'VSIX profile: full (scheduled, manual, or tag)' >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              base='${{ github.event.pull_request.base.sha }}'
            else
              base='${{ github.event.before }}'
            fi
            if [[ "$base" =~ ^0+$ ]]; then
              echo OSD_CI_FULL_VSIX=1 >> "$GITHUB_ENV"
            else
              git fetch --no-tags --depth=1 origin "$base"
              node tools/osd-ci-vsix-profile.mjs "$base" "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            fi
          fi
      # **What is skipped is reported, not swallowed.** Several suites are
      # guarded on `.local/corpus*`, which is not in this repository and
      # never will be — it holds real customer projects. On a runner those
      # cases skip, and a run that skips them is a *narrower* run and not a
      # green one. `--report-skips` prints what did not execute and why, so
      # "passed" here and "passed" on a workstation are different claims
      # that say which they are.
      - name: The suites, shard ${{ matrix.shard }}/4
        run: |
          if [[ "$OSD_CI_FULL_VSIX" == 1 ]]; then
            node tools/osd-suites.mjs --report-skips --shard "${{ matrix.shard }}/4"
          else
            node tools/osd-suites.mjs --report-skips --shard "${{ matrix.shard }}/4" --grep 'packaging changed seed content|packaging selected packs|packaging a prebuilt generation|packaging: the \.vsix installs' --invert
          fi
        env:
          STG_PORT: "3030"

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the tracked source pins
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: built-tree
          path: ${{ runner.temp }}
      - name: Restore and verify this run's build
        run: |
          tar -xf "$RUNNER_TEMP/built-tree.tar"
          test -f gen/osd-ddic-binary.mjs
          test -f output/init.mjs
          test -f build/live/manifest.json
          test -d .local/lars/open-abap-core
          test -f .local/ci-artifact/transpiler/packages/transpiler/build/src/index.js
          echo "TRANSPILER=$PWD/.local/ci-artifact/transpiler" >> "$GITHUB_ENV"
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler packages/transpiler
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs transpiler-cli packages/cli
          TRANSPILER="$PWD/.local/ci-artifact/transpiler" node tools/osd-link.mjs runtime packages/runtime
      # Keep the launchpad's core intents covered on the live Node shape
      # as well as in preview.yml's static Pages check.  This comes after the
      # build, so a broken build fails before browser work;
      # preview.yml remains an independent job and only publishes after its
      # own browser check succeeds.
      - name: Read the installed Playwright version
        id: playwright_version
        run: node -e 'console.log("version=" + require("./package-lock.json").packages["node_modules/@playwright/test"].version)' >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: chromium_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-v1-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium for browser smoke tests
        run: |
          if [[ "${{ steps.chromium_cache.outputs.cache-hit }}" == true ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Launchpad, FCL, taxi F4 and APC smoke tests
        run: node scripts/run-e2e-isolated.mjs test/e2e/launchpad-navigation.spec.mjs test/e2e/fcl.spec.mjs test/e2e/listreport.spec.mjs test/e2e/taxi.spec.mjs test/e2e/zork.spec.mjs test/e2e/lsd.spec.mjs --config playwright.config.mjs

      # This is a different product path from the default SQLite browser
      # smoke: selecting Portable AMDP must execute the original SQLScript
      # through the DuckDB runtime and paint its result, not merely expose an
      # option that later returns HTTP 500.
      - name: Switch Vector Workbench to Portable AMDP on DuckDB
        run: node scripts/run-e2e-isolated.mjs test/e2e/zvdb.spec.mjs --config playwright.config.mjs
        env:
          STG_DB: duckdb

  test:
    if: always()
    needs: [build, suites, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SUITES_RESULT: ${{ needs.suites.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          [[ "$BUILD_RESULT" == success && "$SUITES_RESULT" == success && "$E2E_RESULT" == success ]]
