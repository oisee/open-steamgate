name: kernel conformance (heavy)

# Public pin and content hashes only. No PR trigger; artifacts survive red runs.
on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: kernel-conformance-heavy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The public corpus/int8 Go column is main/nightly/tag evidence, never a PR gate.
  # Mono and QuickJS are reported as not measured until a public pinned source exists.
  kernel-conformance-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: go1.26.0
      GOFLAGS: -buildvcs=false
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - name: Read the corpus pin
        timeout-minutes: 1
        id: corpus_pin
        run: echo "ref=$(cat .github/ci/abapiti.ref)" >> "$GITHUB_OUTPUT"
      - name: Restore the generated corpus by pin and recipe
        timeout-minutes: 5
        id: corpus_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/kernelci/corpus
          key: kernel-corpus-v1-${{ runner.os }}-${{ steps.corpus_pin.outputs.ref }}-${{ hashFiles('tools/osd-kernel-corpus.mjs', '.github/ci/kernel-corpus.json', 'test/fixtures/osgjs-unit-int8/*') }}
      - name: Validate restored corpus content before deciding whether to fetch source
        timeout-minutes: 1
        id: corpus_validation
        run: node tools/osd-kernel-corpus.mjs --check-cache >> "$GITHUB_OUTPUT"
      - name: Check out public ABAPiti for missing or corrupt corpus inputs
        timeout-minutes: 5
        id: abapiti_checkout
        if: steps.corpus_validation.outputs.regenerate == 'true'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oisee/abapiti
          ref: ${{ steps.corpus_pin.outputs.ref }}
          path: .local/kernelci/abapiti-source
          persist-credentials: false
      - name: Retry failed ABAPiti checkout once
        timeout-minutes: 5
        if: steps.corpus_validation.outputs.regenerate == 'true' && steps.abapiti_checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oisee/abapiti
          ref: ${{ steps.corpus_pin.outputs.ref }}
          path: .local/kernelci/abapiti-source
          persist-credentials: false
      - name: Set up Go for corpus generation and runtime checks
        timeout-minutes: 5
        id: setup_go
        continue-on-error: true
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Retry failed Go setup once
        timeout-minutes: 5
        if: steps.setup_go.outcome == 'failure'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Install the corpus C compiler
        timeout-minutes: 5
        if: steps.corpus_validation.outputs.regenerate == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          mkdir -p .local/kernelci/clang-bin
          ln -s /usr/bin/clang-18 .local/kernelci/clang-bin/clang
          ln -s /usr/bin/wasm-ld-18 .local/kernelci/clang-bin/wasm-ld
          echo "$PWD/.local/kernelci/clang-bin" >> "$GITHUB_PATH"
      - name: Generate or verify the pinned public inputs
        timeout-minutes: 11
        id: prepare_corpus
        run: node tools/osd-kernel-corpus.mjs --source .local/kernelci/abapiti-source
      - name: Cache verified generated inputs even if runtime conformance later fails
        timeout-minutes: 5
        if: steps.corpus_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/kernelci/corpus
          key: ${{ steps.corpus_cache.outputs.cache-primary-key }}
      - name: Load the tracked library/runtime pins
        timeout-minutes: 1
        run: node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
      - name: Restore the pinned transpiler build
        timeout-minutes: 5
        id: transpiler_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/transpiler
          key: transpiler-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('libs.lock.json') }}-${{ hashFiles('tools/osd-ci-transpiler-build.sh') }}
      - name: Build and link the pinned runtime
        timeout-minutes: 10
        env:
          TRANSPILER: ${{ runner.temp }}/transpiler
        run: |
          if [[ "${{ steps.transpiler_cache.outputs.cache-hit }}" != true ]]; then
            bash tools/osd-ci-transpiler-build.sh build
          fi
          bash tools/osd-ci-transpiler-build.sh verify
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          echo "TRANSPILER=$TRANSPILER" >> "$GITHUB_ENV"
      - name: Sync the pinned libraries
        timeout-minutes: 5
        run: node tools/osd-libs.mjs --sync
      - name: Run heavy kernel conformance and support drift
        timeout-minutes: 81
        run: OSD_HEAVY_RANGE=50-59 tools/osd-heavy.sh timeout 4800s node tools/osd-kernel-conformance.mjs --profile heavy --source .local/kernelci/abapiti-source
      - name: Publish the conformance summary
        timeout-minutes: 1
        if: always()
        run: |
          if [[ -f .local/kernelci/report/summary.md ]]; then
            cat .local/kernelci/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Kernel conformance failed before producing a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 5
        if: always()
        with:
          name: kernel-conformance-heavy
          path: |
            .local/kernelci/report/
            .local/kernelci/generate.log
          if-no-files-found: error
