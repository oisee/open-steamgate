name: VS Code prerelease

on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vscode-v tag to release
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: vscode-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  vsix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the commit-count version
        run: node scripts/release-version.mjs "$RELEASE_TAG"
      - run: npm run bootstrap
      - run: npm run vsix
      - name: Check package version and checksum
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#vscode-v}"
          vsix="build/vsix/osd-vscode-$version.vsix"
          test -f "$vsix"
          node scripts/release-version.mjs "$RELEASE_TAG" "$vsix"
          (cd build/vsix && sha256sum "osd-vscode-$version.vsix" > "osd-vscode-$version.vsix.sha256")
      - name: Generate and scan release notes
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_TAG" > build/vsix/release-notes.md
          test -s build/vsix/release-notes.md
          # CI has no private identifier list. Exit 2 means structural scan
          # passed with that limitation; exit 1 is a match and must fail.
          status=0
          node tools/osd-leak-scan.mjs --paths build/vsix/release-notes.md || status=$?
          test "$status" -eq 0 -o "$status" -eq 2
      - name: Create or update prerelease and VSIX
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#vscode-v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --title "$RELEASE_TAG" --notes-file build/vsix/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" --prerelease --title "$RELEASE_TAG" --notes-file build/vsix/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "build/vsix/osd-vscode-$version.vsix" \
            "build/vsix/osd-vscode-$version.vsix.sha256"

  binary:
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-baseline
            asset: osd-linux-x64
          - target: bun-linux-arm64
            asset: osd-linux-arm64
          - target: bun-darwin-arm64
            asset: osd-darwin-arm64
          - target: bun-windows-x64-baseline
            asset: osd-windows-x64.exe
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm ci
      - name: Build and checksum the target binary
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs "$RELEASE_TAG"
          mkdir -p build/release
          npm run binary -- "build/release/$ASSET" "$TARGET"
          (cd build/release && sha256sum "$ASSET" > "$ASSET.sha256")
          gh release upload "$RELEASE_TAG" --clobber "build/release/$ASSET" "build/release/$ASSET.sha256"

  compose:
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate and attach Compose variants
        run: |
          set -euo pipefail
          node scripts/release-version.mjs "$RELEASE_TAG"
          export POSTGRES_PASSWORD=compose-validation-only
          export HANA_HOST=hana-validation-only
          export HANA_PASSWORD=compose-validation-only
          for db in sqlite duckdb postgres hana; do
            docker compose -f "docker/compose/$db.yml" config --quiet
            gh release upload "$RELEASE_TAG" --clobber "docker/compose/$db.yml"
          done
