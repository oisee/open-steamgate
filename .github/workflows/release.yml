name: VS Code prerelease

on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Leave blank to use vscode-v<stamped version> from the selected ref
        required: false
        default: ''
        type: string
      draft:
        description: Keep the prerelease as a draft (false publishes an existing draft)
        required: false
        default: true
        type: boolean

permissions:
  contents: read
concurrency:
  group: vscode-release-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.sha) || github.ref_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  vsix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      scan_status: ${{ steps.leak.outputs.status }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select and validate release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="${INPUT_TAG:-$(node scripts/release-version.mjs --suggest)}"
            node scripts/release-version.mjs "$tag" --allow-untagged
          else
            tag="$GITHUB_REF_NAME"
            node scripts/release-version.mjs "$tag"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - run: npm run bootstrap
      - run: npm run vsix
      - name: Check package version and checksum
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#vscode-v}"
          vsix="build/vsix/osd-vscode-$version.vsix"
          test -f "$vsix"
          node scripts/release-version.mjs "$RELEASE_TAG" "$vsix" --allow-untagged
          (cd build/vsix && sha256sum "osd-vscode-$version.vsix" > "osd-vscode-$version.vsix.sha256")
      - name: Generate and scan release notes, README and FILE_ID.DIZ
        id: leak
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          LEAK_IDENTIFIERS_JSON: ${{ secrets.OSD_LEAK_IDENTIFIERS }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#vscode-v}"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            node scripts/release-notes.mjs "$RELEASE_TAG" > build/vsix/release-notes.md
          else
            node scripts/release-notes.mjs "$RELEASE_TAG" --to HEAD > build/vsix/release-notes.md
          fi
          node scripts/release-readme.mjs \
            "osd-vscode-$version.vsix" \
            osd-linux-x64 osd-linux-arm64 osd-darwin-arm64 osd-windows-x64.exe \
            sqlite.yml duckdb.yml postgres.yml hana.yml > build/vsix/README.md
          node scripts/release-readme.mjs --diz "$version" > build/vsix/FILE_ID.DIZ
          { cat build/vsix/release-notes.md; printf '\n'; cat build/vsix/README.md; } > build/vsix/release-body.md
          test -s build/vsix/release-notes.md
          test -s build/vsix/README.md
          test -s build/vsix/FILE_ID.DIZ
          if [[ -n "$LEAK_IDENTIFIERS_JSON" ]]; then
            mkdir -p .local
            printf '%s' "$LEAK_IDENTIFIERS_JSON" > .local/leak-identifiers.json
          fi
          status=0
          node tools/osd-leak-scan.mjs --paths build/vsix/release-notes.md build/vsix/README.md build/vsix/FILE_ID.DIZ || status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 2 && -z "$LEAK_IDENTIFIERS_JSON" && "$GITHUB_EVENT_NAME" == workflow_dispatch && "$DRAFT" == true ]]; then
            echo '::warning::OSD_LEAK_IDENTIFIERS is absent; the private name check did not run'
          elif [[ "$status" -ne 0 ]]; then
            if [[ "$status" -eq 2 && -z "$LEAK_IDENTIFIERS_JSON" ]]; then
              echo '::error::Add the OSD_LEAK_IDENTIFIERS secret or publish by hand after a local npm run leak'
            else
              echo "::error::Release leak scan must pass with the configured identifier list (exit $status)"
            fi
            exit "$status"
          fi
      - name: Create or update prerelease and upload VSIX
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#vscode-v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --tags --force
            node scripts/release-version.mjs --check-target "$RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --prerelease --title "$RELEASE_TAG" --notes-file build/vsix/release-body.md
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$DRAFT" == false ]]; then
              echo 'Run once with draft=true before publishing an untagged dispatch release' >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$(git rev-parse HEAD)" \
              --title "$RELEASE_TAG" --notes-file build/vsix/release-body.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$(git rev-parse HEAD)" \
              --draft --prerelease --title "$RELEASE_TAG" --notes-file build/vsix/release-body.md
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "build/vsix/osd-vscode-$version.vsix" \
            "build/vsix/osd-vscode-$version.vsix.sha256" \
            build/vsix/README.md \
            build/vsix/FILE_ID.DIZ

  binary:
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-baseline
            asset: osd-linux-x64
          - target: bun-linux-arm64
            asset: osd-linux-arm64
          - target: bun-darwin-arm64
            asset: osd-darwin-arm64
          - target: bun-windows-x64-baseline
            asset: osd-windows-x64.exe
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.vsix.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm ci
      - name: Build and checksum the target binary
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs "$RELEASE_TAG" --allow-untagged
          git fetch --tags --force
          node scripts/release-version.mjs --check-target "$RELEASE_TAG"
          mkdir -p build/release
          npm run binary -- "build/release/$ASSET" "$TARGET"
          (cd build/release && sha256sum "$ASSET" > "$ASSET.sha256")
          gh release upload "$RELEASE_TAG" --clobber "build/release/$ASSET" "build/release/$ASSET.sha256"

  compose:
    needs: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.vsix.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and attach Compose variants
        run: |
          set -euo pipefail
          node scripts/release-version.mjs "$RELEASE_TAG" --allow-untagged
          git fetch --tags --force
          node scripts/release-version.mjs --check-target "$RELEASE_TAG"
          export POSTGRES_PASSWORD=compose-validation-only
          export HANA_HOST=hana-validation-only
          export HANA_USER=hana-validation-only
          export HANA_PASSWORD=compose-validation-only
          for db in sqlite duckdb postgres hana; do
            docker compose -f "docker/compose/$db.yml" config --quiet
            gh release upload "$RELEASE_TAG" --clobber "docker/compose/$db.yml"
          done

  publish:
    needs: [vsix, binary, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.vsix.outputs.tag }}
      DRAFT: ${{ inputs.draft }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LEAK_IDENTIFIERS_JSON: ${{ secrets.OSD_LEAK_IDENTIFIERS }}
      SCAN_STATUS: ${{ needs.vsix.outputs.scan_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish completed prerelease
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push || "$DRAFT" == false ]]; then
            if [[ -z "$LEAK_IDENTIFIERS_JSON" ]]; then
              echo '::error::Add the OSD_LEAK_IDENTIFIERS secret or publish by hand after a local npm run leak'
              exit 1
            fi
            if [[ "$SCAN_STATUS" != 0 ]]; then
              echo "::error::Publication requires a passing release leak scan (exit $SCAN_STATUS)"
              exit 1
            fi
          fi
          git fetch --tags --force
          node scripts/release-version.mjs --check-target "$RELEASE_TAG"
          if [[ "$GITHUB_EVENT_NAME" == push || "$DRAFT" == false ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          fi
