name: size budget

# Monoliths may shrink, never grow: tools/osd-size-budget.mjs against
# tools/osd-size-budget.json. A file or package over its budget, a new file
# in go/abap, a package without a README or importing go/abap, or a budget
# raised against the base branch without a reason fails it. The same check
# runs at pre-push (.githooks/pre-push).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: tools/gogen/go/go.sum
      # the base: the target branch of a pull request, the commit before a
      # push to main (a push compared with main itself would check nothing)
      - name: The base's budget
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          else git fetch --no-tags --depth=1 origin "$BEFORE"; fi
      - name: Size budget
        run: node tools/osd-size-budget.mjs --base FETCH_HEAD
