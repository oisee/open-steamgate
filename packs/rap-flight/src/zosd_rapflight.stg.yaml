# The RAP flight reference scenario, read-only, over SADL: every CDS interface
# view of the managed scenario and of the reuse layer that the CDS generator
# takes (one-table projections), served as plain entity sets so the data the
# pack seeds can be looked at and tested over the wire. No behavior: the
# business objects behind these views are what the RAP runtime cannot run
# yet (docs/rap-flight-pack.md). Property names are the CDS element names
# in CamelCase; the managed views keep SAP's snake_case elements as they are.
project: ZOSD_RAPFLIGHT
service: ZOSD_RAPFLIGHT_SRV
model: ZOSD_RAPFLIGHT_MDL
description: "RAP flight reference scenario (SAP-samples, Apache-2.0), read-only over SADL"

entities:
  Travel:
    set: TravelSet
    source: {cds: /DMO/I_TRAVEL_M}
    keys: [TravelId]
    creatable: false
    updatable: false
    deletable: false
    operations: [R, Q]
    properties:
      TravelId: {type: String(8), field: TRAVEL_ID, readonly: true, label: "TRAVEL_ID"}
      AgencyId: {type: String(6), field: AGENCY_ID, readonly: true, label: "AGENCY_ID"}
      CustomerId: {type: String(6), field: CUSTOMER_ID, readonly: true, label: "CUSTOMER_ID"}
      BeginDate: {type: DateTime, field: BEGIN_DATE, readonly: true, label: "BEGIN_DATE"}
      EndDate: {type: DateTime, field: END_DATE, readonly: true, label: "END_DATE"}
      BookingFee: {type: "Decimal(17,2)", field: BOOKING_FEE, readonly: true, label: "BOOKING_FEE"}
      TotalPrice: {type: "Decimal(17,2)", field: TOTAL_PRICE, readonly: true, label: "TOTAL_PRICE"}
      CurrencyCode: {type: String(5), field: CURRENCY_CODE, readonly: true, label: "CURRENCY_CODE"}
      OverallStatus: {type: String(1), field: OVERALL_STATUS, readonly: true, label: "OVERALL_STATUS"}
      Description: {type: String(1024), field: DESCRIPTION, readonly: true, label: "DESCRIPTION"}
      CreatedBy: {type: String(12), field: CREATED_BY, readonly: true, label: "CREATED_BY"}
      CreatedAt: {type: "Decimal(21,7)", field: CREATED_AT, readonly: true, label: "CREATED_AT"}
      LastChangedBy: {type: String(12), field: LAST_CHANGED_BY, readonly: true, label: "LAST_CHANGED_BY"}
      LastChangedAt: {type: "Decimal(21,7)", field: LAST_CHANGED_AT, readonly: true, label: "LAST_CHANGED_AT"}

  Booking:
