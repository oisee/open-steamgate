    source: {cds: /DMO/I_BOOKING_M}
    keys: [TravelId, BookingId]
    creatable: false
    updatable: false
    deletable: false
    operations: [R, Q]
    properties:
      TravelId: {type: String(8), field: TRAVEL_ID, readonly: true, label: "TRAVEL_ID"}
      BookingId: {type: String(4), field: BOOKING_ID, readonly: true, label: "BOOKING_ID"}
      BookingDate: {type: DateTime, field: BOOKING_DATE, readonly: true, label: "BOOKING_DATE"}
      CustomerId: {type: String(6), field: CUSTOMER_ID, readonly: true, label: "CUSTOMER_ID"}
      CarrierId: {type: String(3), field: CARRIER_ID, readonly: true, label: "CARRIER_ID"}
      ConnectionId: {type: String(4), field: CONNECTION_ID, readonly: true, label: "CONNECTION_ID"}
      FlightDate: {type: DateTime, field: FLIGHT_DATE, readonly: true, label: "FLIGHT_DATE"}
      FlightPrice: {type: "Decimal(17,2)", field: FLIGHT_PRICE, readonly: true, label: "FLIGHT_PRICE"}
      CurrencyCode: {type: String(5), field: CURRENCY_CODE, readonly: true, label: "CURRENCY_CODE"}
      BookingStatus: {type: String(1), field: BOOKING_STATUS, readonly: true, label: "BOOKING_STATUS"}
      LastChangedAt: {type: "Decimal(21,7)", field: LAST_CHANGED_AT, readonly: true, label: "LAST_CHANGED_AT"}

  BookingSupplement:
    set: BookingSupplementSet
