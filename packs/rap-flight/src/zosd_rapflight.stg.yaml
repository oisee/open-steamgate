      Attachment: {type: String(40), field: ATTACHMENT, readonly: true, label: "ATTACHMENT"}
      Mimetype: {type: String(128), field: MIMETYPE, readonly: true, label: "MIMETYPE"}
      Filename: {type: String(128), field: FILENAME, readonly: true, label: "FILENAME"}
      Localcreatedby: {type: String(12), field: LOCALCREATEDBY, readonly: true, label: "LOCALCREATEDBY"}
      Localcreatedat: {type: "Decimal(21,7)", field: LOCALCREATEDAT, readonly: true, label: "LOCALCREATEDAT"}
      Locallastchangedby: {type: String(12), field: LOCALLASTCHANGEDBY, readonly: true, label: "LOCALLASTCHANGEDBY"}
