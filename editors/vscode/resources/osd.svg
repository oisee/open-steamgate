<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>open-steamgate</title>
  <!-- A filled silhouette: VS Code draws Activity Bar icons as a mask,
       so shapes read at 24 px where thin strokes turn to noise. -->
  <g fill="#000">
    <!-- steam puffs rising from the funnel -->
    <circle cx="13.9" cy="4.6" r="1.25"/>
    <circle cx="11.3" cy="3.3" r="1.55"/>
    <circle cx="8.3" cy="3.2" r="1.05"/>
    <!-- funnel -->
    <rect x="13" y="6" width="2.6" height="2.8" rx=".4"/>
    <!-- tail fins -->
    <path d="M3.2 8.4 5.6 8.6 7.2 10.6 4.6 11z"/>
    <path d="M3.2 16.6 5.6 16.4 7.2 14.4 4.6 14z"/>
    <!-- hull with the visor cut out of the nose (evenodd hole) -->
    <path fill-rule="evenodd" d="M2.6 12.5C4 11.2 6 9.7 8.4 9 10.6 8.3 13.4 8.2 16 8.2c3.9 0 6.4 1.9 6.4 4.3s-2.5 4.3-6.4 4.3c-2.6 0-5.4-.1-7.6-.8-2.4-.7-4.4-2.2-5.8-3.5zM16.2 11.4h7v2.2h-7a1.1 1.1 0 0 1 0-2.2z"/>
    <!-- goggles inside the visor -->
    <circle cx="18" cy="12.5" r=".75"/>
    <circle cx="20.3" cy="12.5" r=".75"/>
    <!-- gondola -->
    <path d="M10 17.4h6.2l-.8 2.6h-4.6z"/>
  </g>
</svg>
